services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: talkforum
      POSTGRES_USER: talkforum
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data

  api:
    build:
      context: ./backend
      dockerfile: TalkForum.Api/Dockerfile
    restart: unless-stopped
    depends_on:
      - db
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: Host=db;Port=5432;Database=talkforum;Username=talkforum;Password=${POSTGRES_PASSWORD}
      Jwt__Issuer: TalkForum
      Jwt__Audience: TalkForumClient
      Jwt__Key: ${JWT_KEY}
      Jwt__ExpiryMinutes: 60
      Google__ClientId: ${GOOGLE_CLIENT_ID}
      Email__SmtpHost: smtp.gmail.com
      Email__SmtpPort: 587
      Email__Username: ${EMAIL_USERNAME}
      Email__Password: ${EMAIL_PASSWORD}
      Email__FromEmail: ${EMAIL_USERNAME}
      Email__FromName: TalkForum
      Email__FrontendBaseUrl: https://${DOMAIN}
      Cors__AllowedOrigins__0: https://${DOMAIN}
      DataProtection__KeysPath: /keys
    volumes:
      - avatars_data:/app/wwwroot/avatars
      - uploads_data:/app/wwwroot/uploads
      - dataprotection_keys:/keys

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  db_data:
  avatars_data:
  uploads_data:
  dataprotection_keys:
  caddy_data:
  caddy_config:
